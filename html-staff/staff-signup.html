<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="../css-staff/staff-signup.css" rel="stylesheet">
    <title>SignUp-Page</title>
</head>
<body>
    <div class="form-container">
    <h2>Let's Get Started</h2>
    <p>Add Your Personal Details to Continue</p>
    <form>
      <input type="text" name="firstName" placeholder="First Name" required />
      <input type="text" name="lastName" placeholder="Last Name" required />
      <input type="text" name="address" placeholder="Address" required />
      <input type="text" name="Department" placeholder="Department" required />
      <input type="date" name="dob" placeholder="dd-mm-yyyy" required />
      <div class="button-row">
        <button type="reset" class="reset">Reset</button>
        <button type="submit" class="next">Next</button>
      </div>
    </form>
    <p class="login-prompt">Already have an account? <a href="../html-staff/staff-login.html">Login</a></p>
  </div>

</body>
</html>
