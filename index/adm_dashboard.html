<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard | HMS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
      background-color: #f4f6f9;
    }
    .card-icon {
      font-size: 2rem;
      color: #4e73df;
    }
    .dashboard-card {
      transition: transform 0.3s ease-in-out;
    }
    .dashboard-card:hover {
      transform: scale(1.02);
    }
    .sidebar {
      height: 100vh;
      background-color: #343a40;
      color: #fff;
    }
    .sidebar a {
      color: #ddd;
      text-decoration: none;
      display: block;
      padding: 10px 20px;
    }
    .sidebar a:hover {
      background-color: #495057;
    }
  </style>
</head>
<body>
<div class="container-fluid">
  <div class="row">
    <!-- Sidebar -->
    <div class="col-md-2 sidebar p-3">
      <h4 class="text-white">HMS Admin</h4>
      <a href="#">Dashboard</a>
      <a href="#">User Management</a>
      <a href="#">Doctors</a>
      <a href="#">Patients</a>
      <a href="#">Appointments</a>
      <a href="#">Billing</a>
      <a href="#">Reports</a>
      <a href="#">Settings</a>
      <a href="#">Logout</a>
    </div>

    <!-- Main Content -->
    <div class="col-md-10 p-4">
      <h3>Admin Dashboard</h3>
      <div class="row g-4 my-3">
        <div class="col-md-4">
          <div class="card dashboard-card shadow-sm">
            <div class="card-body d-flex align-items-center">
              <i class="bi bi-people-fill card-icon me-3"></i>
              <div>
                <h6>Total Patients</h6>
                <h4>1,248</h4>
              </div>
            </div>
          </div>
        </div>

        <div class="col-md-4">
          <div class="card dashboard-card shadow-sm">
            <div class="card-body d-flex align-items-center">
              <i class="bi bi-person-badge-fill card-icon me-3"></i>
              <div>
                <h6>Total Doctors</h6>
                <h4>122</h4>
              </div>
            </div>
          </div>
        </div>

        <div class="col-md-4">
          <div class="card dashboard-card shadow-sm">
            <div class="card-body d-flex align-items-center">
              <i class="bi bi-hospital card-icon me-3"></i>
              <div>
                <h6>Departments</h6>
                <h4>15</h4>
              </div>
            </div>
          </div>
        </div>

        <div class="col-md-4">
          <div class="card dashboard-card shadow-sm">
            <div class="card-body d-flex align-items-center">
              <i class="bi bi-calendar-event-fill card-icon me-3"></i>
              <div>
                <h6>Appointments Today</h6>
                <h4>98</h4>
              </div>
            </div>
          </div>
        </div>

        <div class="col-md-4">
          <div class="card dashboard-card shadow-sm">
            <div class="card-body d-flex align-items-center">
              <i class="bi bi-hospital-bed card-icon me-3"></i>
              <div>
                <h6>Available Beds</h6>
                <h4>40</h4>
              </div>
            </div>
          </div>
        </div>

        <div class="col-md-4">
          <div class="card dashboard-card shadow-sm">
            <div class="card-body d-flex align-items-center">
              <i class="bi bi-currency-rupee card-icon me-3"></i>
              <div>
                <h6>Billing Summary</h6>
                <h4>₹4.6L</h4>
              </div>
            </div>
          </div>
        </div>
      </div>
      <!-- Add Charts.js or ApexCharts here if needed -->
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
